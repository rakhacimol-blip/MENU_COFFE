<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Cafe Kita - Premium Coffee & Eatery</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                        },
                        dark: {
                            950: '#080605',
                            900: '#0c0a09',
                            800: '#1c1917',
                            700: '#292524',
                            600: '#44403c'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1c1917;
        }
        ::-webkit-scrollbar-thumb {
            background: #d97706;
            border-radius: 10px;
        }

        .glass-panel {
            background: rgba(28, 25, 23, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(251, 191, 36, 0.15);
        }

        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px -5px rgba(217, 119, 6, 0.25);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
        }
        .animate-pulse-glow {
            animation: pulseGlow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-dark-950 text-stone-100 font-sans antialiased min-h-screen pb-28 selection:bg-amber-500 selection:text-black">

    <!-- Ambient Glow background -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-96 bg-gradient-to-b from-amber-600/15 via-amber-900/5 to-transparent blur-3xl pointer-events-none z-0"></div>

    <header class="sticky top-0 z-40 glass-panel border-b border-stone-800/80">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-dark-900 font-extrabold text-xl shadow-lg shadow-amber-600/30">
                    ☕
                </div>
                <div>
                    <h1 class="font-extrabold text-lg text-white tracking-tight flex items-center gap-2">
                        CAFE KITA
                    </h1>
                    <div id="status-operational" class="flex items-center gap-1.5 text-xs text-stone-400">
                        <!-- Dynamic Status Injected via JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Cart Trigger Button -->
            <button onclick="toggleCartModal()" class="relative px-3.5 py-2.5 rounded-xl bg-dark-800 hover:bg-stone-800 border border-stone-700 text-amber-400 transition-all active:scale-95 flex items-center gap-2">
                <i class="fa-solid fa-cart-shopping text-lg"></i>
                <span class="hidden sm:inline text-xs font-bold text-stone-200">Pesanan</span>
                <span id="cart-badge" class="hidden absolute -top-1.5 -right-1.5 bg-amber-500 text-dark-950 text-[10px] font-extrabold w-5 h-5 rounded-full flex items-center justify-center border-2 border-dark-950 animate-bounce">
                    0
                </span>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pt-6 relative z-10">

        <!-- Banner Info Jam Operasional & Nomor WA -->
        <div class="mb-6 p-4 sm:p-5 rounded-2xl bg-gradient-to-r from-amber-950/60 via-dark-800 to-dark-800 border border-amber-500/30 flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-xl relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="flex items-start sm:items-center gap-3.5">
                <div class="p-3 bg-amber-500/15 text-amber-400 rounded-2xl border border-amber-500/20 shrink-0">
                    <i class="fa-regular fa-clock text-2xl"></i>
                </div>
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-amber-400/90">Jam Operasional Cafe</p>
                    <p class="text-base font-extrabold text-white">Setiap Hari: <span class="text-amber-400">09.00 - 20.00 WIB</span></p>
                    <p class="text-xs text-stone-400 mt-0.5">Siap melayani pesan tempat & pemesanan online</p>
                </div>
            </div>

            <div class="flex items-center gap-2 pt-2 md:pt-0 border-t md:border-t-0 border-stone-800">
                <a href="https://wa.me/628118805082" target="_blank" class="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 text-emerald-400 hover:text-emerald-300 font-bold text-xs flex items-center justify-center gap-2.5 transition-all active:scale-95 shadow-md">
                    <i class="fa-brands fa-whatsapp text-lg text-emerald-400"></i>
                    <div class="text-left">
                        <span class="block text-[10px] font-normal text-stone-400 uppercase">WhatsApp Official</span>
                        <span class="text-sm font-extrabold tracking-wide">+62 811-8805-082</span>
                    </div>
                </a>
            </div>
        </div>

        <div class="space-y-4 mb-6">
            <!-- Search Input -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-stone-400 text-sm"></i>
                <input type="text" id="search-input" oninput="renderMenu()" placeholder="Cari kopi, makanan, atau snack favoritmu..." 
                    class="w-full pl-11 pr-4 py-3 bg-dark-800 border border-stone-700/80 rounded-2xl text-stone-100 placeholder-stone-500 focus:outline-none focus:border-amber-500 transition-all text-sm shadow-inner">
            </div>

            <!-- Categories Tabs -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1 text-sm font-medium">
                <button onclick="setCategory('semua', this)" class="category-btn active px-4 py-2 rounded-xl whitespace-nowrap bg-amber-500 text-dark-950 font-bold shadow-md shadow-amber-500/20 transition-all">
                    🔥 Semua Menu
                </button>
                <button onclick="setCategory('kopi', this)" class="category-btn px-4 py-2 rounded-xl whitespace-nowrap bg-dark-800 text-stone-400 hover:text-stone-200 border border-stone-700/60 transition-all">
                    ☕ Kopi
                </button>
                <button onclick="setCategory('non-kopi', this)" class="category-btn px-4 py-2 rounded-xl whitespace-nowrap bg-dark-800 text-stone-400 hover:text-stone-200 border border-stone-700/60 transition-all">
                    🍵 Non-Kopi
                </button>
                <button onclick="setCategory('mocktail', this)" class="category-btn px-4 py-2 rounded-xl whitespace-nowrap bg-dark-800 text-stone-400 hover:text-stone-200 border border-stone-700/60 transition-all">
                    🍹 Mocktail
                </button>
                <button onclick="setCategory('makanan', this)" class="category-btn px-4 py-2 rounded-xl whitespace-nowrap bg-dark-800 text-stone-400 hover:text-stone-200 border border-stone-700/60 transition-all">
                    🍽️ Makanan Utama
                </button>
                <button onclick="setCategory('camilan', this)" class="category-btn px-4 py-2 rounded-xl whitespace-nowrap bg-dark-800 text-stone-400 hover:text-stone-200 border border-stone-700/60 transition-all">
                    🍟 Camilan
                </button>
            </div>
        </div>

        <div id="menu-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Dynamic Menu Items Injected via JavaScript -->
        </div>
    </main>

    <div id="floating-cart" class="fixed bottom-4 left-4 right-4 max-w-xl mx-auto z-30 transition-all duration-300 transform translate-y-28 opacity-0">
        <div class="glass-panel rounded-2xl p-3.5 shadow-2xl border border-amber-500/30 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold">
                    <i class="fa-solid fa-basket-shopping text-lg"></i>
                </div>
                <div>
                    <span id="floating-qty" class="text-xs text-stone-400 font-medium">0 Produk</span>
                    <p id="floating-total" class="font-extrabold text-amber-400 text-base">Rp 0</p>
                </div>
            </div>
            <button onclick="toggleCartModal()" class="px-5 py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-dark-950 font-bold rounded-xl text-sm shadow-lg shadow-amber-500/25 flex items-center gap-2 active:scale-95 transition-all">
                <span>Lihat Pesanan</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <div id="product-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity duration-300 opacity-0">
        <div class="bg-dark-800 border border-stone-700 w-full max-w-lg rounded-t-3xl sm:rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="relative h-48 bg-stone-900 overflow-hidden">
                <img id="modal-img" src="" alt="" class="w-full h-full object-cover">
                <button onclick="closeProductModal()" class="absolute top-4 right-4 w-9 h-9 bg-dark-950/80 backdrop-blur text-stone-300 rounded-full flex items-center justify-center hover:text-white transition-all">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4">
                <div>
                    <h3 id="modal-title" class="text-xl font-bold text-white"></h3>
                    <p id="modal-desc" class="text-stone-400 text-xs mt-1"></p>
                    <p id="modal-price" class="text-lg font-bold text-amber-400 mt-2"></p>
                </div>

                <!-- Temperature Option -->
                <div id="option-temp-container" class="space-y-2 pt-2 border-t border-stone-700/60">
                    <label class="text-xs font-semibold text-stone-300">Pilih Penyajian:</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" onclick="selectTemp('Dingin')" id="temp-cold" class="temp-opt py-2 px-3 rounded-xl border border-amber-500 bg-amber-500/10 text-amber-400 font-semibold text-xs flex items-center justify-center gap-2">
                            🧊 Dingin (Ice)
                        </button>
                        <button type="button" onclick="selectTemp('Panas')" id="temp-hot" class="temp-opt py-2 px-3 rounded-xl border border-stone-700 bg-dark-700 text-stone-400 font-semibold text-xs flex items-center justify-center gap-2">
                            ☕ Panas (Hot)
                        </button>
                    </div>
                </div>

                <!-- Custom Note -->
                <div class="space-y-2 pt-2 border-t border-stone-700/60">
                    <label class="text-xs font-semibold text-stone-300">Catatan Khusus (Opsional):</label>
                    <input type="text" id="modal-note" placeholder="Contoh: Less sugar, ekstra es, tidak pedas, dll." class="w-full px-3.5 py-2.5 bg-dark-950 border border-stone-700 rounded-xl text-xs text-stone-200 focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <div class="p-4 bg-dark-950 border-t border-stone-700 flex items-center gap-3">
                <div class="flex items-center bg-dark-700 border border-stone-700 rounded-xl px-2 py-1">
                    <button onclick="changeModalQty(-1)" class="w-8 h-8 text-stone-300 hover:text-amber-400 font-bold text-lg flex items-center justify-center">-</button>
                    <span id="modal-qty" class="w-8 text-center font-bold text-white text-sm">1</span>
                    <button onclick="changeModalQty(1)" class="w-8 h-8 text-stone-300 hover:text-amber-400 font-bold text-lg flex items-center justify-center">+</button>
                </div>
                <button onclick="confirmAddToCart()" class="flex-1 py-3 bg-amber-500 hover:bg-amber-600 text-dark-950 font-extrabold rounded-xl text-sm transition-all shadow-lg shadow-amber-500/20 active:scale-95">
                    Tambah ke Pesanan
                </button>
            </div>
        </div>
    </div>

    <div id="cart-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex justify-end hidden transition-opacity duration-300 opacity-0">
        <div class="bg-dark-800 w-full max-w-md h-full flex flex-col shadow-2xl border-l border-stone-700 transform transition-transform duration-300 translate-x-full" id="cart-drawer">
            <!-- Cart Header -->
            <div class="p-4 bg-dark-950 border-b border-stone-700 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-basket-shopping text-amber-400 text-lg"></i>
                    <h2 class="font-bold text-white text-base">Keranjang Saya</h2>
                </div>
                <button onclick="toggleCartModal()" class="w-8 h-8 rounded-xl bg-dark-700 text-stone-400 hover:text-white flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Cart Items List -->
            <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- JS Injected items -->
            </div>

            <!-- Order Form -->
            <div class="p-4 bg-dark-950/95 border-t border-stone-700 space-y-3">
                <div id="name-warning" class="hidden text-xs text-rose-400 bg-rose-500/10 border border-rose-500/30 p-2 rounded-xl flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>Harap isi Nama Pemesan terlebih dahulu!</span>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-300 mb-1">Nama Pemesan <span class="text-amber-400">*</span></label>
                    <input type="text" id="cust-name" placeholder="Masukkan nama Anda..." class="w-full px-3 py-2.5 bg-dark-800 border border-stone-700 rounded-xl text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-stone-300 mb-1">Tipe Pesanan</label>
                        <select id="order-type" class="w-full px-3 py-2.5 bg-dark-800 border border-stone-700 rounded-xl text-xs text-white focus:outline-none focus:border-amber-500">
                            <option value="Dine In (Makan di Tempat)">Dine In (Di Tempat)</option>
                            <option value="Takeaway (Bawa Pulang)">Takeaway (Bawa Pulang)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-300 mb-1">No. Meja (Jika Dine In)</label>
                        <input type="text" id="table-num" placeholder="Contoh: Meja 05" class="w-full px-3 py-2.5 bg-dark-800 border border-stone-700 rounded-xl text-xs text-white focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <!-- Total Summary -->
                <div class="pt-2 border-t border-stone-800 space-y-1">
                    <div class="flex justify-between text-xs text-stone-400">
                        <span>Subtotal</span>
                        <span id="cart-subtotal">Rp 0</span>
                    </div>
                    <div class="flex justify-between text-sm font-extrabold text-white pt-1">
                        <span>Total Pembayaran</span>
                        <span id="cart-total" class="text-amber-400">Rp 0</span>
                    </div>
                </div>

                <!-- Submit WhatsApp Button -->
                <button onclick="sendToWhatsApp()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold rounded-xl text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/25 active:scale-95 transition-all">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    Pesan via WhatsApp (+62 811-8805-082)
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-amber-500 text-dark-950 font-bold px-4 py-2.5 rounded-full shadow-2xl text-xs flex items-center gap-2 pointer-events-none transition-all duration-300 opacity-0 -translate-y-4 z-50">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-msg">Item berhasil ditambahkan!</span>
    </div>

    <script>
        // Database Menu Cafe Kita
        const menuData = [
            {
                id: 1,
                title: "Es Kopi Susu Gula Aren",
                category: "kopi",
                price: 18000,
                desc: "Espresso robusta & arabica blended dengan susu segar dan sirup aren asli.",
                image: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=600&q=80",
                badge: "Terfavorit",
                hasTempOption: true
            },
            {
                id: 2,
                title: "Ocean Blue Mocktail",
                category: "mocktail",
                price: 22000,
                desc: "Perpaduan soda segar, sirup blue curacao, perasan lemon & mint segar.",
                image: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=600&q=80",
                badge: "Segar",
                hasTempOption: false
            },
            {
                id: 3,
                title: "Americano Classic",
                category: "kopi",
                price: 15000,
                desc: "Double shot espresso dengan air murni, cita rasa otentik kopi pilihan.",
                image: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=600&q=80",
                badge: "",
                hasTempOption: true
            },
            {
                id: 4,
                title: "Matcha Latte Premium",
                category: "non-kopi",
                price: 24000,
                desc: "Bubuk matcha kualitas Uji Jepang dipadu creamy-nya fresh milk.",
                image: "https://images.unsplash.com/photo-1536256263959-770b48d82b0a?auto=format&fit=crop&w=600&q=80",
                badge: "Recommended",
                hasTempOption: true
            },
            {
                id: 5,
                title: "Nasi Goreng Spesial Cafe",
                category: "makanan",
                price: 28000,
                desc: "Nasi goreng bumbu rempah spesial dengan telur ceplok, sosis, dan kerupuk.",
                image: "https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=600&q=80",
                badge: "Kenyang",
                hasTempOption: false
            },
            {
                id: 6,
                title: "French Fries & Sausage",
                category: "camilan",
                price: 20000,
                desc: "Kentang goreng renyah disajikan dengan sosis panggang dan saus keju.",
                image: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=600&q=80",
                badge: "",
                hasTempOption: false
            }
        ];

        // State Aplikasi
        let currentCategory = 'semua';
        let cart = [];
        let selectedProduct = null;
        let selectedTemp = 'Dingin';
        let modalQty = 1;

        // Nomor WhatsApp Tujuan Pemesanan
        const WHATSAPP_NUMBER = "628118805082";

        document.addEventListener('DOMContentLoaded', () => {
            checkOperationalStatus();
            renderMenu();
        });

        // Dynamic Operational Hours Status (09.00 - 20.00 WIB)
        function checkOperationalStatus() {
            const statusEl = document.getElementById('status-operational');
            const now = new Date();
            const hours = now.getHours();
            
            const isOpen = hours >= 9 && hours < 20;

            if (isOpen) {
                statusEl.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-emerald-400 font-bold">BUKA SEKARANG</span> (09.00 - 20.00 WIB)
                `;
            } else {
                statusEl.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-rose-500"></span>
                    <span class="text-rose-400 font-bold">TUTUP</span> (Buka Kembali 09.00 WIB)
                `;
            }
        }

        // Category Filter Logic
        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(b => {
                b.classList.remove('bg-amber-500', 'text-dark-950', 'font-bold', 'shadow-md', 'shadow-amber-500/20');
                b.classList.add('bg-dark-800', 'text-stone-400', 'border-stone-700/60');
            });
            btn.classList.remove('bg-dark-800', 'text-stone-400', 'border-stone-700/60');
            btn.classList.add('bg-amber-500', 'text-dark-950', 'font-bold', 'shadow-md', 'shadow-amber-500/20');

            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            const searchVal = document.getElementById('search-input').value.toLowerCase();

            const filtered = menuData.filter(item => {
                const matchCat = (currentCategory === 'semua') || (item.category === currentCategory);
                const matchSearch = item.title.toLowerCase().includes(searchVal) || item.desc.toLowerCase().includes(searchVal);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-stone-500 bg-dark-800/50 rounded-2xl border border-stone-800">
                        <i class="fa-solid fa-mug-hot text-4xl mb-3 text-stone-600"></i>
                        <p class="text-sm font-medium">Menu yang Anda cari tidak ditemukan.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="bg-dark-800 border border-stone-800 rounded-2xl overflow-hidden card-hover flex flex-col justify-between">
                    <div>
                        <div class="relative h-40 overflow-hidden bg-stone-900">
                            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
                            ${item.badge ? `<span class="absolute top-3 left-3 bg-amber-500 text-dark-950 font-extrabold text-[10px] px-2.5 py-1 rounded-full uppercase tracking-wider shadow-md">${item.badge}</span>` : ''}
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-white text-base">${item.title}</h3>
                            <p class="text-stone-400 text-xs mt-1 line-clamp-2">${item.desc}</p>
                        </div>
                    </div>
                    <div class="px-4 pb-4 pt-1 flex items-center justify-between border-t border-stone-800/60">
                        <span class="font-extrabold text-amber-400 text-base">Rp ${item.price.toLocaleString('id-ID')}</span>
                        <button onclick="openProductModal(${item.id})" class="px-3.5 py-2 bg-amber-500/10 hover:bg-amber-500 text-amber-400 hover:text-dark-950 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 active:scale-95">
                            <i class="fa-solid fa-plus"></i> Pesan
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function openProductModal(id) {
            selectedProduct = menuData.find(m => m.id === id);
            selectedTemp = 'Dingin';
            modalQty = 1;

            document.getElementById('modal-img').src = selectedProduct.image;
            document.getElementById('modal-title').innerText = selectedProduct.title;
            document.getElementById('modal-desc').innerText = selectedProduct.desc;
            document.getElementById('modal-price').innerText = `Rp ${selectedProduct.price.toLocaleString('id-ID')}`;
            document.getElementById('modal-qty').innerText = modalQty;
            document.getElementById('modal-note').value = '';

            const tempContainer = document.getElementById('option-temp-container');
            if (selectedProduct.hasTempOption) {
                tempContainer.classList.remove('hidden');
                selectTemp('Dingin');
            } else {
                tempContainer.classList.add('hidden');
            }

            const modal = document.getElementById('product-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 10);
        }

        function closeProductModal() {
            const modal = document.getElementById('product-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function selectTemp(type) {
            selectedTemp = type;
            const coldBtn = document.getElementById('temp-cold');
            const hotBtn = document.getElementById('temp-hot');

            if (type === 'Dingin') {
                coldBtn.className = 'temp-opt py-2 px-3 rounded-xl border border-amber-500 bg-amber-500/10 text-amber-400 font-semibold text-xs flex items-center justify-center gap-2';
                hotBtn.className = 'temp-opt py-2 px-3 rounded-xl border border-stone-700 bg-dark-700 text-stone-400 font-semibold text-xs flex items-center justify-center gap-2';
            } else {
                hotBtn.className = 'temp-opt py-2 px-3 rounded-xl border border-amber-500 bg-amber-500/10 text-amber-400 font-semibold text-xs flex items-center justify-center gap-2';
                coldBtn.className = 'temp-opt py-2 px-3 rounded-xl border border-stone-700 bg-dark-700 text-stone-400 font-semibold text-xs flex items-center justify-center gap-2';
            }
        }

        function changeModalQty(delta) {
            if (modalQty + delta >= 1) {
                modalQty += delta;
                document.getElementById('modal-qty').innerText = modalQty;
            }
        }

        // Add to Cart Logic
        function confirmAddToCart() {
            const note = document.getElementById('modal-note').value.trim();
            const tempOption = selectedProduct.hasTempOption ? selectedTemp : '';

            const existingIndex = cart.findIndex(item => 
                item.id === selectedProduct.id && 
                item.temp === tempOption && 
                item.note === note
            );

            if (existingIndex > -1) {
                cart[existingIndex].qty += modalQty;
            } else {
                cart.push({
                    id: selectedProduct.id,
                    title: selectedProduct.title,
                    price: selectedProduct.price,
                    qty: modalQty,
                    temp: tempOption,
                    note: note
                });
            }

            closeProductModal();
            updateCartUI();
            showToast(`"${selectedProduct.title}" ditambahkan ke keranjang`);
        }

        function updateCartUI() {
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            // Badge Update
            const badge = document.getElementById('cart-badge');
            if (totalQty > 0) {
                badge.innerText = totalQty;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            // Floating Cart Bar Update
            const floatingCart = document.getElementById('floating-cart');
            if (totalQty > 0) {
                floatingCart.classList.remove('translate-y-28', 'opacity-0');
                document.getElementById('floating-qty').innerText = `${totalQty} Produk`;
                document.getElementById('floating-total').innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
            } else {
                floatingCart.classList.add('translate-y-28', 'opacity-0');
            }

            // Cart Drawer Render
            const cartItemsEl = document.getElementById('cart-items');
            if (cart.length === 0) {
                cartItemsEl.innerHTML = `
                    <div class="text-center py-16 text-stone-500">
                        <i class="fa-solid fa-basket-shopping text-4xl mb-2 text-stone-600"></i>
                        <p class="text-xs">Keranjang belanja Anda masih kosong.</p>
                    </div>
                `;
            } else {
                cartItemsEl.innerHTML = cart.map((item, idx) => `
                    <div class="p-3 bg-dark-950 border border-stone-800 rounded-xl flex items-center justify-between gap-3">
                        <div class="flex-1">
                            <h4 class="font-bold text-white text-xs">${item.title}</h4>
                            <p class="text-[11px] text-amber-400 font-semibold mt-0.5">Rp ${item.price.toLocaleString('id-ID')}</p>
                            ${item.temp ? `<span class="inline-block mt-1 text-[10px] px-1.5 py-0.5 bg-stone-800 text-stone-300 rounded font-medium">${item.temp}</span>` : ''}
                            ${item.note ? `<p class="text-[10px] text-stone-400 italic mt-0.5">"${item.note}"</p>` : ''}
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="flex items-center bg-stone-800 rounded-lg">
                                <button onclick="updateCartItemQty(${idx}, -1)" class="w-6 h-6 text-stone-300 hover:text-white font-bold flex items-center justify-center text-xs">-</button>
                                <span class="w-5 text-center text-xs font-bold text-white">${item.qty}</span>
                                <button onclick="updateCartItemQty(${idx}, 1)" class="w-6 h-6 text-stone-300 hover:text-white font-bold flex items-center justify-center text-xs">+</button>
                            </div>
                            <button onclick="removeCartItem(${idx})" class="text-stone-500 hover:text-rose-400 p-1">
                                <i class="fa-regular fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('cart-subtotal').innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
            document.getElementById('cart-total').innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
        }

        function updateCartItemQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartUI();
        }

        function removeCartItem(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCartModal() {
            const modal = document.getElementById('cart-modal');
            const drawer = document.getElementById('cart-drawer');

            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    drawer.classList.remove('translate-x-full');
                }, 10);
            } else {
                drawer.classList.add('translate-x-full');
                modal.classList.add('opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }
        }

        function sendToWhatsApp() {
            const warningEl = document.getElementById('name-warning');
            
            if (cart.length === 0) {
                showToast("Keranjang belanja masih kosong!");
                return;
            }

            const name = document.getElementById('cust-name').value.trim();
            const orderType = document.getElementById('order-type').value;
            const tableNum = document.getElementById('table-num').value.trim();

            if (!name) {
                warningEl.classList.remove('hidden');
                document.getElementById('cust-name').focus();
                return;
            } else {
                warningEl.classList.add('hidden');
            }

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            // WhatsApp Message Formatting
            let text = `☕ *PESANAN BARU - CAFE KITA*\n`;
            text += `-------------------------------------------\n`;
            text += `👤 *Nama Pemesan:* ${name}\n`;
            text += `📌 *Tipe Pesanan:* ${orderType}\n`;
            if (tableNum) text += `🪑 *Nomor Meja:* ${tableNum}\n`;
            text += `-------------------------------------------\n\n`;
            text += `📝 *RINCIAN PESANAN:*\n`;

            cart.forEach((item, i) => {
                const sub = item.price * item.qty;
                text += `${i + 1}. *${item.title}* (${item.qty}x)\n`;
                if (item.temp) text += `   └ Varian: ${item.temp}\n`;
                if (item.note) text += `   └ Catatan: _${item.note}_\n`;
                text += `   └ Subtotal: Rp ${sub.toLocaleString('id-ID')}\n\n`;
            });

            text += `-------------------------------------------\n`;
            text += `💰 *TOTAL PEMBAYARAN:* *Rp ${totalPrice.toLocaleString('id-ID')}*\n`;
            text += `-------------------------------------------\n`;
            text += `Mohon segera diproses ya, terima kasih! 🙏`;

            const encodedURL = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
            window.open(encodedURL, '_blank');
        }

        // Toast Helper Function
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;

            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-4');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2500);
        }
    </script>
</body>
</html>
