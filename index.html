<!DOCTYPE html>
<html lang="id" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu Cafe Kita - Premium Coffee & Eatery</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                        },
                        espresso: {
                            950: '#0c0a09',
                            900: '#141210',
                            800: '#1f1b18',
                            700: '#2c2723',
                            600: '#423b35'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Smooth Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0c0a09;
        }
        ::-webkit-scrollbar-thumb {
            background: #d97706;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f59e0b;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(20, 18, 16, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.15);
        }

        .glass-card {
            background: rgba(31, 27, 24, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .card-hover {
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card-hover:hover {
            transform: translateY(-5px) scale(1.01);
            border-color: rgba(245, 158, 11, 0.35);
            box-shadow: 0 16px 32px -8px rgba(217, 119, 6, 0.2);
        }

        /* Hide Horizontal Scrollbars */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Shimmer Loading Animation */
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
        .shimmer {
            position: relative;
            overflow: hidden;
        }
        .shimmer::after {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0,
                rgba(255, 255, 255, 0.05) 20%,
                rgba(255, 255, 255, 0.1) 60%,
                rgba(255, 255, 255, 0)
            );
            animation: shimmer 2s infinite;
            content: '';
        }
    </style>
</head>
<body class="bg-espresso-950 text-stone-100 font-sans antialiased min-h-screen pb-28 selection:bg-amber-500 selection:text-black">

    <!-- Header Navigation -->

            <div class="flex items-center gap-3">

                    ☕

                <div>
                    <h1 class="font-black text-lg sm:text-xl text-white tracking-tight flex items-center gap-2">
                        CAFE KITA

                    <div id="header-status-badge" class="flex items-center gap-1.5 text-xs text-stone-400 font-medium">

                    </div>
                </div>
            </div>

            <!-- Cart Trigger Button Header -->
            <button onclick="toggleCartDrawer()" class="relative p-2.5 sm:px-4 sm:py-2.5 rounded-2xl bg-espresso-800 hover:bg-espresso-700 border border-stone-700/80 text-amber-400 transition-all active:scale-95 flex items-center gap-2">

                <span id="cart-badge" class="hidden absolute -top-1.5 -right-1.5 bg-gradient-to-r from-amber-400 to-amber-600 text-espresso-950 text-[11px] font-extrabold w-5 h-5 rounded-full flex items-center justify-center border-2 border-espresso-950 shadow-md">
                    0
                </span>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pt-6 relative z-10">

                <i class="fa-solid fa-clock"></i>
            </div>
            
            <div class="flex items-center gap-3.5 z-10">
                <div class="p-3.5 bg-amber-500/10 border border-amber-500/20 text-amber-400 rounded-2xl flex-shrink-0">
                    <i class="fa-regular fa-clock text-2xl"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <p class="text-xs font-bold text-amber-400 uppercase tracking-wider">Jam Operasional</p>
                        <span id="banner-live-indicator" class="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                            <!-- Live status JS -->
                        </span>
                    </div>
                    <p class="text-base sm:text-lg font-black text-white mt-0.5">
                        Setiap Hari: <span class="text-amber-400">09.00 - 20.00 WIB</span>
                    </p>
                    <p class="text-xs text-stone-400 mt-0.5">Pesanan masuk setelah jam 20.00 WIB diproses besok pagi.</p>
                </div>
            </div>

            <div class="flex items-center gap-2 text-xs font-semibold px-3.5 py-2 rounded-xl bg-espresso-950/80 border border-stone-800 text-stone-300 w-fit z-10">
                <i class="fa-solid fa-location-dot text-amber-400"></i>
                <span>Jl. Kenangan No. 12, Surabaya</span>
            </div>
        </div>

        <!-- Search & Filter Controls -->

            <!-- Search Input -->

                <button id="clear-search" onclick="clearSearch()" class="hidden absolute right-3.5 top-1/2 -translate-y-1/2 text-stone-500 hover:text-stone-300 p-1">

            </div>

            <!-- Category Pill Tabs -->

            </button>
        </div>
    </div>

    <!-- Product Customization Modal -->

                </div>

                <!-- Temperature / Serving Option -->

                        <span class="text-[10px] text-amber-400 uppercase font-semibold">* Wajib dipilih</span>
                    </label>
                    <div class="grid grid-cols-2 gap-2.5">

                            🧊 Ice (Dingin)
                        </button>

    <!-- Cart Slide-over Drawer Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex justify-end hidden transition-opacity duration-300 opacity-0">

                </button>
            </div>

            <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Dynamic Items via JS -->
            </div>

                <div class="space-y-2">
                    <div>
                        <label class="block text-xs font-bold text-stone-300 mb-1">Nama Pemesan <span class="text-rose-500">*</span></label>

                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold text-stone-300 mb-1">Tipe Pesanan</label>
                            <select id="order-type" onchange="toggleTableNumInput()" class="w-full px-3 py-2.5 bg-espresso-800 border border-stone-700 rounded-xl text-xs text-white focus:outline-none focus:border-amber-500">
                                <option value="Dine In (Makan di Tempat)">Dine In (Di Tempat)</option>
                                <option value="Takeaway (Bawa Pulang)">Takeaway (Bawa Pulang)</option>
                            </select>
                        </div>
                        <div id="table-num-container">
                            <label class="block text-xs font-bold text-stone-300 mb-1">No. Meja</label>
                            <input type="text" id="table-num" placeholder="Misal: Meja 05" class="w-full px-3 py-2.5 bg-espresso-800 border border-stone-700 rounded-xl text-xs text-white placeholder-stone-500 focus:outline-none focus:border-amber-500">
                        </div>
                    </div>
                </div>

                <!-- Price Summary -->
                <div class="pt-3 border-t border-stone-800/80 space-y-1.5">
                    <div class="flex justify-between text-xs text-stone-400">
                        <span>Subtotal Produk</span>
                        <span id="cart-subtotal" class="font-semibold text-stone-200">Rp 0</span>
                    </div>
                    <div class="flex justify-between text-sm font-black text-white pt-1">
                        <span>Total Pembayaran</span>
                        <span id="cart-total" class="text-amber-400">Rp 0</span>
                    </div>
                </div>

                <!-- WA Order Button -->
                <button onclick="sendToWhatsApp()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold rounded-xl text-sm flex items-center justify-center gap-2.5 shadow-lg shadow-emerald-600/20 active:scale-95 transition-all">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    <span>Kirim Pesanan ke WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Toast Notification Component -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-amber-500 text-espresso-950 font-extrabold px-5 py-3 rounded-2xl shadow-2xl text-xs sm:text-sm flex items-center gap-2.5 pointer-events-none transition-all duration-300 opacity-0 -translate-y-6 z-50 border border-amber-300">
        <i class="fa-solid fa-circle-check text-base"></i>
        <span id="toast-msg">Pesanan berhasil ditambahkan!</span>
    </div>

                category: "non-kopi",
                price: 23000,
                desc: "Cokelat Belgian pekat disatu padukan dengan cita rasa gurih kacang hazelnut.",
                image: "https://images.unsplash.com/photo-1544787219-7f47ccb76574?auto=format&fit=crop&w=600&q=80",
                badge: "",
                hasTempOption: true
            }
        ];

        // State Aplikasi
        let currentCategory = 'semua';
        let cart = [];
        let selectedProduct = null;
        let selectedTemp = 'Dingin';
        let modalQty = 1;

        // Nomor WhatsApp Admin Cafe Kita (Format internasional tanpa simbol '+')
        const WHATSAPP_NUMBER = "6281234567890";

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            updateOperationalStatus();
            renderMenu();
            // Continuously verify store hours every minute
            setInterval(updateOperationalStatus, 60000);
        });

        // Calculate Operational Hours (09.00 - 20.00 WIB)
        function updateOperationalStatus() {
            const now = new Date();
            const hours = now.getHours();
            
            // Operational Condition: BUKA starting 09:00 until 19:59 (TUTUP at 20:00)
            const isOpen = hours >= 9 && hours < 20;

            const headerBadge = document.getElementById('header-status-badge');
            const bannerIndicator = document.getElementById('banner-live-indicator');

            if (isOpen) {
                headerBadge.innerHTML = `
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-emerald-400 font-extrabold">BUKA SEKARANG</span>
                    <span class="text-stone-500">| 09.00 - 20.00</span>
                `;
                bannerIndicator.className = "inline-flex items-center gap-1 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                bannerIndicator.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> BUKA SEKARANG`;
            } else {
                headerBadge.innerHTML = `
                    <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
                    <span class="text-rose-400 font-extrabold">TUTUP</span>
                    <span class="text-stone-500">| Buka 09.00 WIB</span>
                `;
                bannerIndicator.className = "inline-flex items-center gap-1 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30";
                bannerIndicator.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span> TUTUP SAAT INI`;
            }
        }

        // Search Input Handling
        function handleSearch() {
            const val = document.getElementById('search-input').value;
            const clearBtn = document.getElementById('clear-search');
            if (val.trim() !== '') {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderMenu();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            document.getElementById('clear-search').classList.add('hidden');
            renderMenu();
        }

        // Filter Category Function
        function setCategory(category, btnElement) {
            currentCategory = category;
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = "category-btn px-4 py-2.5 rounded-2xl whitespace-nowrap bg-espresso-800 text-stone-400 hover:text-stone-200 border border-stone-700/60 transition-all transform active:scale-95 flex items-center gap-2";
            });

            btnElement.className = "category-btn active px-4 py-2.5 rounded-2xl whitespace-nowrap bg-gradient-to-r from-amber-500 to-amber-600 text-espresso-950 font-bold shadow-md shadow-amber-500/20 transition-all transform active:scale-95 flex items-center gap-2";

            renderMenu();
        }

        // Render Menu Cards Grid
        function renderMenu() {
            const container = document.getElementById('menu-container');
            const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();

            const filteredMenu = menuData.filter(item => {
                const matchesCategory = (currentCategory === 'semua') || (item.category === currentCategory);
                const matchesSearch = item.title.toLowerCase().includes(searchQuery) || item.desc.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            if (filteredMenu.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-16 text-center text-stone-500 space-y-3">
                        <div class="w-16 h-16 mx-auto rounded-full bg-espresso-800 border border-stone-800 flex items-center justify-center text-stone-600 text-2xl">
                            <i class="fa-solid fa-mug-hot"></i>
                        </div>
                        <p class="text-sm font-semibold">Tidak ada menu yang sesuai dengan pencarian Anda.</p>
                        <button onclick="clearSearch()" class="px-4 py-2 bg-amber-500/10 text-amber-400 rounded-xl text-xs font-bold border border-amber-500/20 hover:bg-amber-500/20">Tampilkan Semua Menu</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredMenu.map(item => `
                <div class="glass-card rounded-3xl overflow-hidden card-hover flex flex-col justify-between">
                    <div>
                        <div class="relative h-44 overflow-hidden bg-stone-900 shimmer">
                            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover transform hover:scale-110 transition-transform duration-500" loading="lazy">
                            ${item.badge ? `<span class="absolute top-3 left-3 bg-gradient-to-r from-amber-400 to-amber-500 text-espresso-950 font-black text-[10px] px-2.5 py-1 rounded-full uppercase tracking-wider shadow-md">${item.badge}</span>` : ''}
                        </div>
                        <div class="p-4 sm:p-5">
                            <h3 class="font-extrabold text-white text-base leading-snug">${item.title}</h3>
                            <p class="text-stone-400 text-xs mt-1.5 leading-relaxed line-clamp-2">${item.desc}</p>
                        </div>
                    </div>
                    <div class="px-4 pb-4 sm:px-5 sm:pb-5 pt-1 flex items-center justify-between border-t border-stone-800/60 mt-auto">
                        <div>
                            <span class="text-[10px] text-stone-500 font-semibold block">Harga</span>
                            <span class="font-black text-amber-400 text-base sm:text-lg">Rp ${item.price.toLocaleString('id-ID')}</span>
                        </div>
                        <button onclick="openProductModal(${item.id})" class="px-4 py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-espresso-950 rounded-xl text-xs font-extrabold transition-all flex items-center gap-1.5 shadow-md shadow-amber-500/15 active:scale-95">
                            <i class="fa-solid fa-plus text-xs"></i> Pesan
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Customization Modal Logic
        function openProductModal(id) {
            selectedProduct = menuData.find(m => m.id === id);
            selectedTemp = 'Dingin';
            modalQty = 1;

            document.getElementById('modal-img').src = selectedProduct.image;
            document.getElementById('modal-title').innerText = selectedProduct.title;
            document.getElementById('modal-desc').innerText = selectedProduct.desc;
            document.getElementById('modal-price').innerText = `Rp ${selectedProduct.price.toLocaleString('id-ID')}`;
            document.getElementById('modal-qty').innerText = modalQty;
            document.getElementById('modal-note').value = '';

            const badgeEl = document.getElementById('modal-badge');
            if (selectedProduct.badge) {
                badgeEl.innerText = selectedProduct.badge;
                badgeEl.classList.remove('hidden');
            } else {
                badgeEl.classList.add('hidden');
            }

            const tempContainer = document.getElementById('option-temp-container');
            if (selectedProduct.hasTempOption) {
                tempContainer.classList.remove('hidden');
                selectTemp('Dingin');
            } else {
                tempContainer.classList.add('hidden');
            }

            const modal = document.getElementById('product-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 10);
        }

        function closeProductModal() {
            const modal = document.getElementById('product-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function selectTemp(type) {
            selectedTemp = type;
            const coldBtn = document.getElementById('temp-cold');
            const hotBtn = document.getElementById('temp-hot');

            if (type === 'Dingin') {
                coldBtn.className = 'temp-opt py-2.5 px-3 rounded-xl border border-amber-500 bg-amber-500/10 text-amber-400 font-bold text-xs flex items-center justify-center gap-2 transition-all';
                hotBtn.className = 'temp-opt py-2.5 px-3 rounded-xl border border-stone-800 bg-espresso-800 text-stone-400 font-bold text-xs flex items-center justify-center gap-2 transition-all';
            } else {
                hotBtn.className = 'temp-opt py-2.5 px-3 rounded-xl border border-amber-500 bg-amber-500/10 text-amber-400 font-bold text-xs flex items-center justify-center gap-2 transition-all';
                coldBtn.className = 'temp-opt py-2.5 px-3 rounded-xl border border-stone-800 bg-espresso-800 text-stone-400 font-bold text-xs flex items-center justify-center gap-2 transition-all';
            }
        }

        function changeModalQty(delta) {
            if (modalQty + delta >= 1) {
                modalQty += delta;
                document.getElementById('modal-qty').innerText = modalQty;
            }
        }

        // Cart Logic
        function confirmAddToCart() {
            const note = document.getElementById('modal-note').value.trim();
            const tempOption = selectedProduct.hasTempOption ? selectedTemp : '';

            const existingIndex = cart.findIndex(item => 
                item.id === selectedProduct.id && 
                item.temp === tempOption && 
                item.note === note
            );

            if (existingIndex > -1) {
                cart[existingIndex].qty += modalQty;
            } else {
                cart.push({
                    id: selectedProduct.id,
                    title: selectedProduct.title,
                    price: selectedProduct.price,
                    qty: modalQty,
                    temp: tempOption,
                    note: note
                });
            }

            closeProductModal();
            updateCartUI();
            showToast(`" ${selectedProduct.title} " berhasil dimasukkan!`);
        }

        function updateCartUI() {
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            // Badge Header
            const badge = document.getElementById('cart-badge');
            if (totalQty > 0) {
                badge.innerText = totalQty;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            // Bottom Floating Bar
            const floatingCart = document.getElementById('floating-cart');
            if (totalQty > 0) {
                floatingCart.classList.remove('translate-y-32', 'opacity-0', 'pointer-events-none');
                document.getElementById('floating-qty').innerText = `${totalQty} Item Pesanan`;
                document.getElementById('floating-total').innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
            } else {
                floatingCart.classList.add('translate-y-32', 'opacity-0', 'pointer-events-none');
            }

            // Drawer Items Render
            const cartItemsEl = document.getElementById('cart-items');
            if (cart.length === 0) {
                cartItemsEl.innerHTML = `
                    <div class="text-center py-16 text-stone-500 space-y-2">
                        <i class="fa-solid fa-basket-shopping text-4xl mb-2 text-stone-600"></i>
                        <p class="text-xs font-semibold">Keranjang pesanan Anda masih kosong.</p>
                        <p class="text-[11px] text-stone-600">Pilih menu favorit Anda di atas!</p>
                    </div>
                `;
            } else {
                cartItemsEl.innerHTML = cart.map((item, idx) => `
                    <div class="p-3.5 bg-espresso-800 border border-stone-800 rounded-2xl flex items-center justify-between gap-3 shadow-md">
                        <div class="flex-1 min-w-0">
                            <h4 class="font-extrabold text-white text-xs truncate">${item.title}</h4>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-xs font-bold text-amber-400">Rp ${(item.price * item.qty).toLocaleString('id-ID')}</span>
                                ${item.temp ? `<span class="text-[9px] px-1.5 py-0.5 bg-amber-500/10 text-amber-400 font-bold rounded-md border border-amber-500/20">${item.temp}</span>` : ''}
                            </div>
                            ${item.note ? `<p class="text-[10px] text-stone-400 italic mt-1 bg-espresso-950/60 p-1.5 rounded-lg border border-stone-800">"${item.note}"</p>` : ''}
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <div class="flex items-center bg-espresso-950 border border-stone-700/80 rounded-xl">
                                <button onclick="updateCartItemQty(${idx}, -1)" class="w-7 h-7 text-stone-300 hover:text-white font-black flex items-center justify-center text-xs">-</button>
                                <span class="w-6 text-center text-xs font-black text-white">${item.qty}</span>
                                <button onclick="updateCartItemQty(${idx}, 1)" class="w-7 h-7 text-stone-300 hover:text-white font-black flex items-center justify-center text-xs">+</button>
                            </div>
                            <button onclick="removeCartItem(${idx})" class="text-stone-500 hover:text-rose-400 p-1.5 transition-colors">
                                <i class="fa-regular fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('cart-subtotal').innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
            document.getElementById('cart-total').innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
        }

        function updateCartItemQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartUI();
        }

        function removeCartItem(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleTableNumInput() {
            const orderType = document.getElementById('order-type').value;
            const tableContainer = document.getElementById('table-num-container');
            if (orderType.includes('Dine In')) {
                tableContainer.classList.remove('hidden');
            } else {
                tableContainer.classList.add('hidden');
            }
        }

        function toggleCartDrawer() {
            const modal = document.getElementById('cart-modal');
            const drawer = document.getElementById('cart-drawer');

            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    drawer.classList.remove('translate-x-full');
                }, 10);
            } else {
                drawer.classList.add('translate-x-full');
                modal.classList.add('opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }
        }

        // Send Order to WhatsApp
        function sendToWhatsApp() {
            if (cart.length === 0) {
                showToast("⚠️ Keranjang belanja Anda masih kosong!");
                return;
            }

            const name = document.getElementById('cust-name').value.trim();
            const orderType = document.getElementById('order-type').value;
            const tableNum = document.getElementById('table-num').value.trim();

            if (!name) {
                showToast("⚠️ Silakan isi Nama Pemesan terlebih dahulu!");
                document.getElementById('cust-name').focus();
                return;
            }

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            // Construct Beautiful WhatsApp Message
            let text = `☕ *PESANAN BARU - CAFE KITA*\n`;
            text += `===============================\n`;
            text += `👤 *Nama Pemesan:* ${name}\n`;
            text += `📌 *Tipe Pesanan:* ${orderType}\n`;
            if (orderType.includes('Dine In') && tableNum) {
                text += `🪑 *Nomor Meja:* ${tableNum}\n`;
            }
            text += `===============================\n\n`;
            text += `🛒 *RINCIAN MENU PESANAN:*\n`;

            cart.forEach((item, i) => {
                const sub = item.price * item.qty;
                text += `*${i + 1}. ${item.title}* (${item.qty}x)\n`;
                if (item.temp) text += `   ├ Varian: ${item.temp}\n`;
                if (item.note) text += `   ├ Catatan: _${item.note}_\n`;
                text += `   └ Subtotal: Rp ${sub.toLocaleString('id-ID')}\n\n`;
            });

            text += `===============================\n`;
            text += `💰 *TOTAL PEMBAYARAN:* *Rp ${totalPrice.toLocaleString('id-ID')}*\n`;
            text += `===============================\n`;
            text += `Mohon segera dikonfirmasi dan diproses. Terima kasih! 🙏`;

            const encodedURL = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
            window.open(encodedURL, '_blank');
        }

        // Custom Toast Helper
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;

            toast.classList.remove('opacity-0', '-translate-y-6');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-6');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2800);
        }
    </script>
</body>
</html>
